<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Chat with ACI Infotech services, industries, technologies, and case studies">
  <meta name="theme-color" content="#073f35">
  <title>ACI Chatbot Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">A</div>
      <div class="brand-copy">
        <strong>ACI Chatbot Assistant</strong>
        <span>Services, industries and client outcomes</span>
      </div>
      <div id="liveStatus" class="live-status checking" role="status">
        <i></i><span>Checking knowledge base</span>
      </div>
      <button id="newChat" class="new-chat" type="button" title="Start a new conversation">
        <span aria-hidden="true">+</span> New chat
      </button>
    </header>

    <section class="conversation">
      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer-wrap">
        <form id="chatForm">
          <textarea
            id="prompt"
            required
            maxlength="12000"
            rows="1"
            aria-label="Question for the ACI Chatbot Assistant"
            placeholder="Ask about ACI services, industries, technologies or case studies..."
          ></textarea>
          <div class="composer-actions">
            <span id="characterCount" aria-hidden="true">0 / 12000</span>
            <button id="sendButton" type="submit" aria-label="Send message">
              <span>Send</span>
              <b aria-hidden="true">→</b>
            </button>
          </div>
        </form>
        <p class="notice">
          Grounded in approved ACI sources. Project figures are ACI-reported outcomes and
          should be verified before business use.
        </p>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
