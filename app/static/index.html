<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Chat with ACI Infotech services and industry knowledge">
  <title>ACI Knowledge Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">A</div>
      <div class="brand-copy">
        <strong>ACI Knowledge Assistant</strong>
        <span>Services and industries</span>
      </div>
      <div class="live-status"><i></i> Knowledge base online</div>
    </header>

    <section class="conversation">
      <div id="messages" class="messages" aria-live="polite">
        <article class="assistant">
          <div class="avatar">A</div>
          <div class="message-copy">
            <p>Hello! Ask me about ACI Infotech's services, AI and data capabilities, cybersecurity, healthcare, or financial-services expertise.</p>
          </div>
        </article>
      </div>

      <div id="suggestions" class="suggestions">
        <button type="button">What AI services does ACI provide?</button>
        <button type="button">Tell me about ACI's healthcare capabilities.</button>
        <button type="button">How does ACI support financial services?</button>
      </div>

      <form id="chatForm">
        <textarea id="prompt" required maxlength="12000" rows="1" placeholder="Ask about ACI services and industries..."></textarea>
        <button type="submit" aria-label="Send message">
          <span>Send</span>
          <b aria-hidden="true">→</b>
        </button>
      </form>
      <p class="notice">Answers use the approved ACI knowledge base. Verify important details with ACI.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
