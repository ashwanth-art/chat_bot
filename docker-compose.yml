services:
  chatbot:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    networks: [app_net, observability]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks: [observability]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks: [app_net]
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    profiles: [tls]
    environment:
      RAG_DOMAIN: ${RAG_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [app_net, proxy_net]
    restart: unless-stopped

networks:
  app_net:
  observability:
  proxy_net:

volumes:
  prometheus_data:
  grafana_data:
  mlflow_data:
  caddy_data:
  caddy_config:
