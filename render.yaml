services:
  - type: web
    name: governai-rag-chatbot
    runtime: docker
    plan: free
    repo: https://github.com/ashwanth-art/chat_bot
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CHATBOT_API_KEY
        generateValue: true
      - key: CLOUD_AUDIT_API_KEY
        generateValue: true
      - key: MONITORING_API_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: MONGODB_DATABASE
        value: aci_chatbot
      - key: ACI_COLLECTION
        value: aci_openai_chunks
      - key: ACI_VECTOR_INDEX
        value: openai_vector_index
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: TOP_K
        value: "5"
      - key: MAX_CONTEXT_CHARS
        value: "12000"
      - key: LOG_LEVEL
        value: INFO
